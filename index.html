<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login.tela</title>
</head>

<body>
    <main class="login-container">
        <header>
            <h1>Tela de login</h1>
            <p>Coloque sua conta e logue no nosso site o quanto antes.</p>
        </header>

        <section>
            <div class="login">
            <form action="login.php" method="POST">
                <label for="username">Nome de usuário:</label>
                <input class="user" type="text" id="username" name="username" required>
            </div>
            
            <div class="password-container">    
                <label>Senha:</label>
                <input class="password" id="password" name="password" required>
            </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Lembrar-me</label>
                </div>

                <div>
                    <button class="entrar" type="submit">Entrar</button>
                </div>
            </form>
        </section>
            
        <div class="cadastro">
             <p>Não tem uma conta? <a href="register.html">Cadastre-se aqui</a></p>
        </div>

        <div class="recuperar-senha">
            <p>Esqueceu sua senha? <a href="forgot_password.html">Recupere aqui</a></p>        
        </div>
</main>

    <footer>
        <p>&copy; 2024 Meu Site. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
